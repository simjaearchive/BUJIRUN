:root{

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Gowun Dodum","Pretendard","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
h1,h2,.tab,.pill,.btn,.chip,.rk,.score,.sum b{font-family:"Jua","Gowun Dodum","Malgun Gothic",sans-serif;font-weight:400}
header{position:relative;overflow:hidden;background:linear-gradient(135deg,#ffb48f,#ffd27a 70%,#fff0b8);color:#fff;padding:20px 16px 0;border-radius:0 0 34px 34px;box-shadow:0 8px 20px rgba(255,170,120,.25)}
header::before,header::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.25);pointer-events:none}
header::before{width:150px;height:150px;right:-30px;top:-60px}
header::after{width:90px;height:90px;right:140px;bottom:20px}
.wrap{max-width:1200px;margin:0 auto;position:relative;z-index:1}
header h1{margin:0;font-size:clamp(12px,3.8vw,26px);white-space:nowrap;letter-spacing:-.3px;text-shadow:0 2px 0 rgba(200,100,60,.25)}
.brand{display:inline-block;font-size:1.35em;color:#fff;background:linear-gradient(135deg,#ff7e5f,#ff9b7a);padding:0 .5em;border-radius:999px;margin:0 2px;text-shadow:0 2px 0 rgba(180,70,40,.35);box-shadow:0 4px 0 rgba(200,90,50,.35);transform:rotate(-2deg)}
header p{margin:8px 0 14px;font-size:13.5px;color:#7a4a32;font-weight:700;background:rgba(255,255,255,.7);display:inline-block;padding:6px 14px;border-radius:14px;line-height:1.5}
.tabs{display:flex;gap:6px}
.tab{flex:1;max-width:150px;border:0;background:rgba(255,255,255,.35);color:#fff;padding:11px 0;font-size:16px;border-radius:18px 18px 0 0;cursor:pointer}
.tab.on{background:var(--bg);color:var(--pri-d)}
main{max-width:1200px;margin:0 auto;padding:18px 12px 60px}
.sub{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.pill{border:2px solid var(--line);background:#fff;color:var(--mute);padding:7px 16px;border-radius:999px;font-size:15px;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 4px 10px rgba(255,140,100,.3)}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:18px;color:var(--pri-d)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.lbl{font-size:13px;color:var(--mute);min-width:34px}
.chip{border:2px solid var(--line);background:#fff;padding:5px 12px;border-radius:999px;font-size:14px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--mint-l);border-color:var(--mint);color:#3b8f74}
select,input[type=text],input[type=password]{font:inherit;padding:8px 12px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);outline:none}
select:focus,input:focus{border-color:var(--pri)}
select.km{min-width:84px;font-weight:700}
select.km.has{background:var(--mint-l);border-color:var(--mint);color:#3b8f74}
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{padding:9px 6px;text-align:center;border-bottom:1px dashed var(--line);font-size:14px}
th{font-size:12px;color:var(--mute);background:#fff4e4;position:sticky;top:0;font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400}
th:first-child{border-radius:12px 0 0 12px}th:last-child{border-radius:0 12px 12px 0}
td.l,th.l{text-align:left;white-space:nowrap}
td.no{white-space:nowrap}
tr.top1 td{background:var(--butter)}
tr.top1 td:first-child{border-radius:12px 0 0 12px}tr.top1 td:last-child{border-radius:0 12px 12px 0}
.medal{font-size:19px}
.rk{color:var(--pri-d)}
.score{color:var(--pri-d);font-size:16px}
.bar{height:8px;background:#fdeedd;border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb48f,#ff9b7a);border-radius:6px}
.btn{border:0;background:var(--pri);color:#fff;padding:9px 18px;border-radius:999px;font-size:15px;cursor:pointer;box-shadow:0 4px 10px rgba(255,140,100,.3)}
.btn.sec{background:#fff;color:var(--pri-d);border:2px solid var(--pri);box-shadow:none}
.btn.red{background:var(--danger)}
.note{font-size:12.5px;color:var(--mute);margin:8px 0 0}
.sum{display:flex;gap:8px;margin-bottom:10px}
.sum div{flex:1;background:var(--mint-l);border-radius:16px;padding:8px;text-align:center}
.sum b{display:block;font-size:20px;color:#3b8f74}
.sum span{font-size:12px;color:var(--mute)}
.scroll{overflow-x:auto}
.no{color:var(--mute);font-size:12px;width:22px;text-align:right}
.small{font-size:12px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pri-d);color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--shadow)}
#toast.on{opacity:.96}
.sync{display:block;font-size:12.5px;color:#c4573a;font-weight:700;margin-top:2px}
.rank-scroll{max-height:455px;overflow-y:auto}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.sec{font-size:21px;margin:10px 2px 12px;color:var(--pri-d)}.sec .small{font-family:"Gowun Dodum",sans-serif;margin-left:8px}
@media(max-width:900px){.grid3{grid-template-columns:1fr}}
.empty{padding:26px;text-align:center;color:var(--mute)}
@media(max-width:560px){th,td{padding:8px 3px;font-size:13px}.hide-s{display:none}}

async function loadRemote(){
  if(!DB_URL) return;
  try{
    const [d,x] = await Promise.all([fetch(dbUrl("/records")).then(r=>r.json()), fetch(dbUrl("/teachers")).then(r=>r.json())]);
    records = d || {}; extra = x || {};
    saveLocal(); setSync("● 서버 연결됨"); render(true);
  }catch(e){ setSync("○ 오프라인(이 기기에 저장)"); }
}
async function setRecord(sid, date, km){
  const k = `${sid}_${date}`;
  if(km>0) records[k]=km; else delete records[k];
  saveLocal();
  if(DB_URL){
    try{
      await fetch(`${DB_URL.replace(/\/$/,"")}/records/${k}.json`, km>0
        ? {method:"PUT",body:JSON.stringify(km)} : {method:"DELETE"});
      setSync("● 서버 연결됨");
    }catch(e){ setSync("○ 서버 저장 실패"); toast("서버 저장 실패 — 네트워크를 확인하세요"); }
  }
}
async function remote(path, method, body){
  if(!DB_URL) return;
  try{ await fetch(dbUrl(path), body===undefined?{method}:{method,body:JSON.stringify(body)}); setSync("● 서버 연결됨"); }
  catch(e){ setSync("○ 서버 저장 실패"); toast("서버 저장 실패 — 네트워크를 확인하세요"); }
}
async function addTeacher(name){
  const id = "X"+Date.now().toString(36); extra[id]=name; saveLocal(); await remote(`/teachers/${id}`,"PUT",name);
}
async function removeTeacher(id){
  delete extra[id]; await remote(`/teachers/${id}`,"DELETE");
  for(const d of DATES){ const k=`${id}_${d}`; if(records[k]){ delete records[k]; await remote(`/records/${k}`,"DELETE"); } }
  saveLocal();
}
function stat(sid){
  let km=0,cnt=0;
  for(const d of DATES){ const v=records[`${sid}_${d}`]; if(v>0){km+=v;cnt++;} }
  return {km,cnt};
}
const scoreOf = (km,cnt) => km*2 + cnt*5;

/* ===== 순위 계산 ===== */
function classRanking(g){
  const rows = classesOf(g).map(c=>{
    const list = students.filter(s=>s.g===g&&s.c===c);
    let km=0,cnt=0,part=0;
    list.forEach(s=>{const t=stat(s.id);km+=t.km;cnt+=t.cnt;if(t.cnt)part++;});
    const bonus = DATES.some(d=>records[`T${g}-${c}_${d}`]>0) ? HR_BONUS : 0;
    return {c,total:list.length,part,km,cnt,bonus,score:scoreOf(km,cnt)+bonus};
  }).sort((a,b)=>b.score-a.score||b.km-a.km||a.c-b.c);
  rows.forEach((r,i)=>r.rank = i&&rows[i-1].score===r.score ? rows[i-1].rank : i+1);
  return rows;
}
function personRanking(g,c,q){
  let rows = students.filter(s=>(!g||s.g===g)&&(!c||s.c===c))
    .map(s=>({s,...stat(s.id)})).filter(r=>r.cnt>0)
    .sort((a,b)=>b.km-a.km||b.cnt-a.cnt||a.s.g-b.s.g||a.s.c-b.s.c||a.s.n-b.s.n);
  rows.forEach((r,i)=>r.rank = i&&rows[i-1].km===r.km&&rows[i-1].cnt===r.cnt ? rows[i-1].rank : i+1);
  if(q) rows = rows.filter(r=>r.s.name.includes(q));
  return rows;
}
function teacherRanking(){
  const rows = teachers().map(t=>({t,...stat(t.id)})).filter(r=>r.cnt>0)
    .sort((a,b)=>b.km-a.km||b.cnt-a.cnt||a.t.name.localeCompare(b.t.name));
  rows.forEach((r,i)=>r.rank = i&&rows[i-1].km===r.km&&rows[i-1].cnt===r.cnt ? rows[i-1].rank : i+1);
  return rows;
}

    return `<div class="card"><h2>${g}학년</h2><table><thead><tr><th>순위</th><th>반</th><th>거리</th><th>횟수</th><th>점수</th></tr></thead><tbody>
    ${rows.map(r=>`<tr class="${r.rank===1&&r.score>0?"top1":""}"><td class="rk"><span class="medal">${r.score>0?medal(r.rank):""}</span> ${r.rank}</td>
      <td><b>${g}-${r.c}</b></td><td>${fmt(r.km)}km</td><td>${r.cnt}회</td>      <td class="score">${fmt(r.score)}<div class="bar"><i style="width:${r.score/max*100}%"></i></div></td></tr>`).join("")}
    </tbody></table></div>`;
  }).join("") + `</div>`;
}
function viewPersonRank(){
  const rows = personRanking(0,0,ui.pQ), shown = rows.slice(0,ui.pQ?50:20);
  return `<h2 class="sec">🏃 개인별 기록 순위 <span class="small">총 거리 순 · 동점은 참여횟수 · 이름을 검색하면 내 순위 확인</span></h2>
    <div class="row"><input type="text" id="q" placeholder="🔍 이름 검색" value="${esc(ui.pQ)}"></div>
    <div class="card">${rows.length?`<div class="rank-scroll"><table><thead><tr><th>순위</th><th class="l">학생</th><th>학년·반</th><th>총 거리</th><th>참여횟수</th></tr></thead><tbody>
    ${shown.map(r=>`<tr class="${r.rank===1?"top1":""}"><td class="rk"><span class="medal">${medal(r.rank)}</span> ${r.rank}</td>
      <td class="l"><b>${esc(r.s.name)}</b></td><td>${r.s.g}학년 ${r.s.c}반</td><td class="score">${fmt(r.km)}km</td><td>${r.cnt}회</td></tr>`).join("")}
    </tbody></table></div>${!ui.pQ&&rows.length>10?`<p class="note" style="text-align:center">↕ 스크롤하면 20위까지 볼 수 있습니다</p>`:""}`:`<div class="empty">${ui.pQ?"검색 결과가 없거나 아직 기록이 없습니다.":"기록이 없습니다."}</div>`}</div>`;
}
function viewTeacherRank(){
  const rows = teacherRanking().slice(0,10);
  return `<h2 class="sec">👩‍🏫 선생님 기록 순위 <span class="small">TOP 10 · 총 거리 순 · 동점은 참여횟수</span></h2>
    <div class="card">${rows.length?`<table><thead><tr><th>순위</th><th class="l">선생님</th><th>소속</th><th>총 거리</th><th>참여횟수</th></tr></thead><tbody>
    ${rows.map(r=>`<tr class="${r.rank===1?"top1":""}"><td class="rk"><span class="medal">${medal(r.rank)}</span> ${r.rank}</td>
      <td class="l"><b>${esc(r.t.name)}</b></td><td>${r.t.hr?`${r.t.g}학년 ${r.t.c}반 담임`:"교직원"}</td><td class="score">${fmt(r.km)}km</td><td>${r.cnt}회</td></tr>`).join("")}
    </tbody></table>`:`<div class="empty">아직 기록이 없습니다.</div>`}</div>`;
}
function viewRecordRoom(){
  const subs=[["class","🏆 학급별"],["person","🏃 개인별"]];
  return `<div class="sub">${subs.map(([k,t])=>`<button class="pill ${ui.sub===k?"on":""}" data-sub="${k}">${t}</button>`).join("")}</div>`
    + (ui.sub==="class"?viewClassRank():viewPersonRank()+viewTeacherRank());
}

/* ===== 관리자 ===== */
function viewLogin(){
  return `<div class="card" style="max-width:360px;margin:20px auto"><h2>🔒 관리자 로그인</h2>
    <div class="row"><input type="password" id="pw" placeholder="비밀번호" style="flex:1"><button class="btn" id="login">확인</button></div></div>`;
}
function viewAdminRecords(){
  const list = students.filter(s=>s.g===ui.g&&s.c===ui.c);
  return `<div class="card"><h2>기록 입력</h2><p class="note" style="margin:0 0 10px">📅 운영일: 11/9(월)~11/18(수) 평일 · 11/11(수)는 쉬어가는 날이라 입력칸이 없습니다.</p>${gradeClassPicker()}
    <div class="scroll"><table><thead><tr><th>번호</th><th class="l">이름</th>${DATES.map(d=>`<th>${dLabel(d)}</th>`).join("")}<th>합계</th></tr></thead><tbody>
    ${list.map(s=>{const t=stat(s.id);return `<tr><td class="no">${s.n}</td><td class="l"><b>${esc(s.name)}</b></td>
      ${DATES.map(d=>`<td>${kmSelect(s.id,d)}</td>`).join("")}<td class="small" data-acc="${s.id}">${fmt(t.km)}km · ${t.cnt}회</td></tr>`}).join("")}
    </tbody></table></div></div>`;
}
function viewAdminTeachers(){
  return `<div class="card"><h2>선생님 기록 입력</h2><p class="note" style="margin:0 0 10px">📅 운영일: 11/9(월)~11/18(수) 평일 · 11/11(수)는 쉬어가는 날이라 입력칸이 없습니다.</p>
    <div class="row"><input type="text" id="tname" placeholder="담임 외 선생님 이름" maxlength="20"><button class="btn" id="addT">추가</button></div>
    <div class="scroll"><table><thead><tr><th class="l">선생님</th>${DATES.map(d=>`<th>${dLabel(d)}</th>`).join("")}<th>합계</th></tr></thead><tbody>
    ${teachers().map(t=>{const s=stat(t.id);return `<tr><td class="l"><b>${esc(t.name)}</b> <span class="small">${t.hr?`${t.g}-${t.c} 담임`:`<button class="chip" data-del="${t.id}">삭제</button>`}</span></td>
      ${DATES.map(d=>`<td>${kmSelect(t.id,d)}</td>`).join("")}<td class="small" data-acc="${t.id}">${fmt(s.km)}km · ${s.cnt}회</td></tr>`}).join("")}
    </tbody></table></div>
    <p class="note">담임선생님이 0.5km 이상 기록한 날이 1회 이상이면 담임 반에 +${HR_BONUS}점이 한 번만 들어갑니다. (2회·3회 기록해도 +${HR_BONUS}점 그대로) (선생님 본인의 거리는 학급 거리에 더해지지 않습니다.)</p></div>`;
}
function viewAdmin(){
  if(!ui.admOk) return viewLogin();
  const subs=[["input","학생 기록 입력"],["teacher","선생님 기록 입력"]];
  return `<div class="sub">${subs.map(([k,t])=>`<button class="pill ${ui.adm===k?"on":""}" data-adm="${k}">${t}</button>`).join("")}<button class="pill" id="logout">로그아웃</button></div>`
    + (ui.adm==="teacher"?viewAdminTeachers():viewAdminRecords());
}
/* ===== 렌더 & 이벤트 ===== */
const app = document.getElementById("app");
function render(keepFocus){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===ui.top));
  const y = window.scrollY;
  app.innerHTML = ui.top==="rec" ? viewRecordRoom() : viewAdmin();
  if(keepFocus) window.scrollTo(0,y);
}

document.querySelector(".tabs").addEventListener("click",e=>{
  const t=e.target.dataset.t; if(t){ui.top=t;render();}
});
app.addEventListener("click",async e=>{
  const el=e.target.closest("[data-g],[data-c],[data-d],[data-del],[data-sub],[data-adm],button,label"); if(!el) return;
  const D=el.dataset;
  if(D.g){ui.g=+D.g;ui.c=1;}
  else if(D.c) ui.c=+D.c;
  else if(D.d) ui.date=D.d;
  else if(D.sub) ui.sub=D.sub;
  else if(D.adm) ui.adm=D.adm;
  else if(D.del){
    if(!confirm(`${nameOf(D.del)} 선생님과 기록을 삭제할까요?`)) return;
    await removeTeacher(D.del);
  }
  else if(el.id==="addT"){
    const inp=document.getElementById("tname"), name=inp.value.trim();
    if(!name){toast("이름을 입력하세요");return;}
    await addTeacher(name); toast(`${name} 선생님 추가됨`);
  }
  else if(el.id==="login"){
    if(document.getElementById("pw").value===ADMIN_PW){ui.admOk=true;ss("set","1");}
    else {toast("비밀번호가 올바르지 않습니다");return;}
  }
  else if(el.id==="logout"){ui.admOk=false;ss("del");}
  else return;
  render();
});
app.addEventListener("change",async e=>{
  const t=e.target;
  if(t.classList.contains("km")){
    const km=+t.value; await setRecord(t.dataset.sid,t.dataset.date,km);
    t.classList.toggle("has",km>0); toast(km>0?`${nameOf(t.dataset.sid)} ${km.toFixed(1)}km 저장`:"기록 삭제");
    const s=stat(t.dataset.sid); const acc=app.querySelector(`[data-acc="${t.dataset.sid}"]`);
    if(acc) acc.textContent=`${fmt(s.km)}km · ${s.cnt}회`;
  }
});
app.addEventListener("input",e=>{
  if(e.target.id==="q"){ ui.pQ=e.target.value.trim(); 
    const pos=e.target.selectionStart; render(true); const q=document.getElementById("q"); q.focus(); q.setSelectionRange(pos,pos); }
});
app.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="pw") document.getElementById("login").click();
  if(e.key==="Enter"&&e.target.id==="tname") document.getElementById("addT").click();
});

setSync(DB_URL?"연결 중…":"● 이 기기에 저장");
render(); loadRemote();
if(DB_URL) setInterval(()=>{ if(!document.activeElement||document.activeElement.tagName!=="SELECT") loadRemote(); },20000);
</script>
</body>
</html>
